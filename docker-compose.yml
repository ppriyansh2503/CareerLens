services:
  backend:
    image: priyanshu2503/careerlens-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./careerlens.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - PLATFORM_ADMIN_EMAIL=${PLATFORM_ADMIN_EMAIL:-superadmin@careerlens.io}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@careerlens.io}
      - SMTP_TLS=${SMTP_TLS:-True}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/careerlens.db:/app/careerlens.db
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    image: priyanshu2503/careerlens-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate --url http://frontend:3000
    depends_on:
      frontend:
        condition: service_healthy


